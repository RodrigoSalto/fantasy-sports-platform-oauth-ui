<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://idfzftlvscytcmuydbos.supabase.co http://127.0.0.1:54321 http://localhost:54321; form-action 'self'"
    />
    <title>Reset fantasy sports password</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; }
      main { width: min(28rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #d9dfeb; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgb(23 32 51 / 12%); }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { line-height: 1.5; }
      label { display: block; margin: 1rem 0; font-weight: 600; }
      input { box-sizing: border-box; display: block; width: 100%; margin-top: .4rem; padding: .7rem; border: 1px solid #aeb8ca; border-radius: .5rem; font: inherit; }
      button { margin-top: .35rem; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #175cd3; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      [role="alert"] { padding: .75rem; border-radius: .5rem; background: #fff0f0; color: #a21c1c; }
      [role="status"] { padding: .75rem; border-radius: .5rem; background: #effaf3; color: #166534; }
      a { color: #175cd3; }
      .hidden { display: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #101522; color: #f3f5fa; }
        main { border-color: #34405a; background: #182033; }
        input { border-color: #53617d; background: #101522; color: #f3f5fa; }
        [role="alert"] { background: #3b1d24; color: #fecdd3; }
        [role="status"] { background: #163324; color: #bbf7d0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Reset your password</h1>
      <p id="description">Request a password recovery email for your fantasy sports account.</p>
      <p id="message" class="hidden" role="status"></p>
      <p id="error" class="hidden" role="alert"></p>
      <form id="request-form" class="hidden">
        <label>Email <input id="email" name="email" type="email" autocomplete="username" required="required" /></label>
        <button id="request-button" type="submit">Send recovery link</button>
      </form>
      <form id="update-form" class="hidden">
        <label>New password <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required="required" /></label>
        <label>Confirm new password <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required="required" /></label>
        <button id="update-button" type="submit">Save new password</button>
      </form>
      <p><a id="back-link" href="./authorize.html">Return to authorization</a></p>
      <noscript>This recovery page requires JavaScript to continue.</noscript>
    </main>
    <script>
      (() => {
        const defaultEndpoint = "https://idfzftlvscytcmuydbos.supabase.co/functions/v1/mcp/oauth/recover";
        const params = new URLSearchParams(window.location.search);
        const configuredEndpoint = params.get("recovery_endpoint") || defaultEndpoint;
        const requestForm = document.getElementById("request-form");
        const updateForm = document.getElementById("update-form");
        const requestButton = document.getElementById("request-button");
        const updateButton = document.getElementById("update-button");
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const message = document.getElementById("message");
        const error = document.getElementById("error");
        const backLink = document.getElementById("back-link");
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const accessToken = hash.get("access_token") || params.get("access_token");
        const validEndpoint = (() => {
          try {
            const endpoint = new URL(configuredEndpoint, window.location.origin);
            const allowedOrigins = new Set([
              "https://idfzftlvscytcmuydbos.supabase.co",
              "http://127.0.0.1:54321",
              "http://localhost:54321",
            ]);
            return allowedOrigins.has(endpoint.origin) &&
              endpoint.pathname === "/functions/v1/mcp/oauth/recover"
              ? endpoint.toString()
              : undefined;
          } catch {
            return undefined;
          }
        })();

        function showError(text) {
          error.textContent = text;
          error.classList.remove("hidden");
          message.classList.add("hidden");
        }

        function showMessage(text) {
          message.textContent = text;
          message.classList.remove("hidden");
          error.classList.add("hidden");
        }

        if (!validEndpoint) {
          showError("This recovery request is invalid or expired.");
          return;
        }

        if (accessToken) {
          title.textContent = "Choose a new password";
          description.textContent = "Set a new password, then return to the authorization page.";
          updateForm.classList.remove("hidden");
        } else {
          requestForm.classList.remove("hidden");
        }

        requestForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          requestButton.disabled = true;
          try {
            const response = await fetch(validEndpoint, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                action: "request",
                email: document.getElementById("email").value,
              }),
            });
            if (!response.ok) throw new Error("recovery_request_failed");
            showMessage("If the account exists, a recovery email has been sent. Check your inbox.");
            requestForm.reset();
          } catch {
            showError("The recovery email could not be requested. Try again.");
          } finally {
            requestButton.disabled = false;
          }
        });

        updateForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = document.getElementById("password").value;
          const confirmation = document.getElementById("confirm-password").value;
          if (password.length < 8 || password.length > 128 || password !== confirmation) {
            showError("Passwords must match and be between 8 and 128 characters.");
            return;
          }
          updateButton.disabled = true;
          try {
            const response = await fetch(validEndpoint, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ action: "update", access_token: accessToken, password }),
            });
            if (!response.ok) throw new Error("password_update_failed");
            window.history.replaceState(null, "", window.location.pathname);
            updateForm.classList.add("hidden");
            title.textContent = "Password updated";
            description.textContent = "Your password has been changed. Return to authorization and sign in again.";
            showMessage("Password updated successfully.");
          } catch {
            showError("The recovery link is invalid or expired. Request a new one.");
          } finally {
            updateButton.disabled = false;
          }
        });

        backLink.href = new URL("./authorize.html", window.location.href).toString();
      })();
    </script>
  </body>
</html>
